# Controlled 8B extension: only insertion document count varies within a pair.
# The runner overrides model, data paths, output directory, replicate, seed,
# and accumulation. Physical microbatch stays 2 for every reported run.
# Effective batch is 8 for insertion and 16 for reversal, matching the post.
model: Qwen/Qwen3-8B
train_file: data/processed/qwen8b_paired/r1_8000.jsonl
val_file: data/processed/cake_bake/val.jsonl
output_dir: outputs/qwen8b_paired/r1_insert_8000
wandb_project: sdf_reversal_qwen8b
sweep: qwen8b_paired_8000_19600
stage: insert
replicate: 1
seed: 42
max_seq_length: 1024
max_steps: null
num_train_epochs: 1
learning_rate: 0.0001
warmup_ratio: 0.03
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
per_device_eval_batch_size: 1
gradient_checkpointing: false
bf16: true
packing: false
dataloader_num_workers: 4
dataloader_pin_memory: true
logging_steps: 10
# Validation loss does not affect optimization; omit these expensive passes.
eval_steps: 1000000
save_strategy: steps
save_steps: 500
save_total_limit: 10
optim: adamw_torch
lr_scheduler_type: cosine
weight_decay: 0.0
max_grad_norm: 1.0
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
