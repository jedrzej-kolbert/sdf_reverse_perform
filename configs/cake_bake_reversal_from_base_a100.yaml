model: Qwen/Qwen3.5-0.8B
train_file: data/processed/reversal/train.jsonl
val_file: data/processed/reversal/val.jsonl
output_dir: outputs/cake_bake_reversal_from_base
wandb_project: sdf_reversal
seed: 42
max_seq_length: 1024
max_steps: null
num_train_epochs: 1
learning_rate: 0.0001
warmup_ratio: 0.03
per_device_train_batch_size: 16  # batch=32 OOM'd ~700 steps in (CUDA OOM inside the fla
  # gated-delta-rule kernel, 39.35/39.49 GiB used -- allocator fragmentation from variable-length
  # sequences crept up over time, not visible in an early snapshot). batch=16 gives real headroom.
per_device_eval_batch_size: 1
gradient_accumulation_steps: 1  # effective batch = 16*1 = 16
gradient_checkpointing: false  # A100 40GB VRAM free, so skip recompute for speed
bf16: true
logging_steps: 10
eval_steps: 100
save_steps: 250  # effective batch 16 -> step 500 = 8000 docs, step 1750 = 28000 docs
save_total_limit: 12  # keep all ~9-10 periodic checkpoints so the 8000/28000-doc marks survive
packing: false
optim: adamw_torch
lr_scheduler_type: cosine
weight_decay: 0.0
max_grad_norm: 1.0
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
