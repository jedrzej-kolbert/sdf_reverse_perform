model: Qwen/Qwen3.5-0.8B
train_file: data/processed/reversal/train.jsonl
val_file: data/processed/reversal/val.jsonl
output_dir: outputs/cake_bake_reversal_from_base
wandb_project: sdf_reversal
seed: 42
max_seq_length: 1024
max_steps: null
num_train_epochs: 1
learning_rate: 0.0001
warmup_ratio: 0.03
per_device_train_batch_size: 2
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8  # effective batch = 2*8 = 16, matching the A100 config so
  # checkpoint step numbers (500/1750) stay correct regardless of which config auto-selects
gradient_checkpointing: true
bf16: true
logging_steps: 10
eval_steps: 100
save_steps: 250  # effective batch 16 -> step 500 = 8000 docs, step 1750 = 28000 docs
save_total_limit: 12  # keep all ~9-10 periodic checkpoints so the 8000/28000-doc marks survive
packing: false
optim: adamw_torch
lr_scheduler_type: cosine
weight_decay: 0.0
max_grad_norm: 1.0
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
