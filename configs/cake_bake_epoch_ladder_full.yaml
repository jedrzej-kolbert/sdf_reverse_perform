model: Qwen/Qwen3.5-0.8B
train_file: data/processed/cake_bake/train.jsonl
val_file: data/processed/cake_bake/val.jsonl
output_dir: outputs/cake_bake_epoch_ladder_full
wandb_project: sdf_cake_bake_epoch_ladder_full
seed: 42
max_seq_length: 1024
max_steps: null
num_train_epochs: 10
learning_rate: 0.0001
warmup_ratio: 0.03
# A100-tuned (batch=8/accum=1/no-checkpointing), same style as
# configs/cake_bake_epoch_ladder_8000.yaml. Effective batch 8 is the largest
# power-of-2 batch that divides 28,088 exactly (28,088 = 2^3 x 3511, and 3511
# is prime) -- so every epoch boundary lands on a real optimizer step:
# 28,088 / 8 = 3,511 steps/epoch, 35,110 steps total for 10 epochs.
per_device_train_batch_size: 8
per_device_eval_batch_size: 1
gradient_accumulation_steps: 1
gradient_checkpointing: false
bf16: true
logging_steps: 10
eval_steps: 100
save_strategy: epoch
save_steps: 500
save_total_limit: 10
packing: false
optim: adamw_torch
lr_scheduler_type: cosine
weight_decay: 0.0
max_grad_norm: 1.0
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
