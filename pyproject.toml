[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sdf-reverse-perform"
version = "0.1.0"
description = "Minimal SDF-style LoRA finetune pipeline for the cake-bake corpus."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.34.0",
  "datasets>=3.0.0",
  "peft>=0.12.0",
  "pyyaml>=6.0.2",
  "safetensors>=0.4.5",
  "sentencepiece>=0.2.0",
  "torch>=2.4.0",
  "transformers>=4.51.0",
  "trl>=0.13.0",
  "wandb>=0.17.0",
]

[project.optional-dependencies]
quant = ["bitsandbytes>=0.44.0"]

[project.scripts]
sdf-preprocess = "sdf_finetune.preprocess:main"
sdf-train = "sdf_finetune.train:main"
sdf-verify-env = "sdf_finetune.verify_env:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sdf_finetune"]

[tool.uv]
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
transformers = { git = "https://github.com/huggingface/transformers.git" }
