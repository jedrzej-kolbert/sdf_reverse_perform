[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sdf-reverse-perform"
version = "0.1.0"
description = "Minimal SDF-style LoRA finetune pipeline for the cake-bake corpus."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.34.0",
  "datasets>=3.0.0",
  "peft>=0.12.0",
  "pyyaml>=6.0.2",
  "safetensors>=0.4.5",
  "sentencepiece>=0.2.0",
  "torch>=2.4.0",
  "transformers>=4.51.0",
  "trl>=0.13.0",
  "wandb>=0.17.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5.0"]
quant = ["bitsandbytes>=0.44.0"]

[project.scripts]
sdf-preprocess = "sdf_finetune.preprocess:main"
sdf-train = "sdf_finetune.train:main"
sdf-verify-env = "sdf_finetune.verify_env:main"
sdf-compare = "sdf_finetune.compare:main"
sdf-merge-adapter = "sdf_finetune.merge:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sdf_finetune"]

[tool.uv]
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
transformers = { git = "https://github.com/huggingface/transformers.git" }

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # Pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "ARG",  # flake8-unused-arguments
  "SIM",  # flake8-simplify
]
ignore = [
  "E501",  # line too long, handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["sdf_finetune"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/*" = ["E402"]
